# Public vhost for the Freed Data Chat query API.
#
# Install (the symlink MUST end in .conf — nginx.conf includes only
# sites-enabled/*.conf, and a differently-named symlink is silently ignored:
# nginx -t passes, reload succeeds, and nothing binds):
#   sudo cp nginx-chatquery.conf /etc/nginx/sites-available/chatquery
#   sudo ln -sfn /etc/nginx/sites-available/chatquery \
#                /etc/nginx/sites-enabled/chatquery.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   ss -ltn | grep 8157      # confirm it actually bound
#
# ACCESS CONTROL: none at the HTTP layer, deliberately. Unlike callhistory
# (private-address bind, no auth), this vhost binds ALL interfaces
# (`listen 8157;`, no address) because the Vercel serverless function that
# calls it has no fixed egress IP to allow-list. The security boundary is
# instead the app itself: every request to query_api.py must carry
# `Authorization: Bearer <QUERY_API_SECRET>` (constant-time compare, see
# vm/query_api.py and docs/CONTRACTS.md), and the API only ever runs a single
# read-only SELECT/WITH statement as the `chat_ro` Postgres role. Do not
# remove the app-level bearer check and rely on this vhost for access control.
#
# TLS-upgrade path (not done yet): if/when this needs HTTPS instead of plain
# HTTP on 8157, put a real hostname in DNS pointing at 34.100.177.202, get a
# cert (certbot --nginx), add a `listen 8157 ssl;` block with the cert/key
# directives, and redirect the plain-HTTP block to it. Until then the bearer
# secret is the only thing protecting this endpoint, so treat leaking
# QUERY_API_SECRET as equivalent to leaking read access to the warehouse.
#
# Reachable from anywhere:
#   http://34.100.177.202:8157/

server {
    listen 8157;
    server_name _;

    # Request bodies are just {"sql": "..."} strings; 1m is generous headroom.
    client_max_body_size 1m;

    # Nothing here should ever be cached by a shared proxy — every response is
    # live warehouse data (or an auth/validation error).
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;

    access_log /var/log/nginx/chatquery.access.log;
    error_log  /var/log/nginx/chatquery.error.log;

    location = /healthz {
        proxy_pass http://127.0.0.1:8158/healthz;
    }

    location / {
        proxy_pass http://127.0.0.1:8158;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # statement_timeout on the query side defaults to 60s; leave real
        # headroom above that so nginx never cuts off a query that Postgres
        # itself would have let finish (or time out with a clean 422).
        proxy_connect_timeout 10s;
        proxy_send_timeout    90s;
        proxy_read_timeout    90s;
        proxy_buffering       off;
    }
}
