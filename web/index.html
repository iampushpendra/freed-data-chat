<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Analyst</title>
<style>
  :root{
    --bg:#eef1fb;
    --surface:#ffffff;
    --border:#dde3f5;
    --border-strong:#c7d0ee;
    --text:#161a35;
    --text-secondary:#454b74;
    --text-muted:#767ea3;
    --accent:#0e7490;
    --accent-dark:#0b5b70;
    --accent-soft:#e0f5f8;
    --accent-soft-strong:#c3ecf2;
    --accent-glow:#22d3ee;
    --accent2:#e0a100;
    --danger:#b91c1c;
    --danger-bg:#fdf0f0;
    --danger-border:#f3c9c9;
    --shadow: 0 1px 2px rgba(20,25,60,.05), 0 4px 18px rgba(20,30,80,.08);
    --radius: 14px;
    --radius-sm: 8px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0a0e1f;
      --surface:#121a34;
      --border:#232c4d;
      --border-strong:#303c66;
      --text:#edf0fb;
      --text-secondary:#aeb6da;
      --text-muted:#7c86ad;
      --accent:#0c7d93;
      --accent-dark:#095e70;
      --accent-soft:#0f2839;
      --accent-soft-strong:#123448;
      --accent-glow:#2de5f2;
      --accent2:#ffc94d;
      --danger:#f87171;
      --danger-bg:#2a1516;
      --danger-border:#4a2224;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 4px 24px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0a0e1f;
    --surface:#121a34;
    --border:#232c4d;
    --border-strong:#303c66;
    --text:#edf0fb;
    --text-secondary:#aeb6da;
    --text-muted:#7c86ad;
    --accent:#0c7d93;
    --accent-dark:#095e70;
    --accent-soft:#0f2839;
    --accent-soft-strong:#123448;
    --accent-glow:#2de5f2;
    --accent2:#ffc94d;
    --danger:#f87171;
    --danger-bg:#2a1516;
    --danger-border:#4a2224;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 4px 24px rgba(0,0,0,.4);
  }
  :root[data-theme="light"]{
    --bg:#eef1fb;
    --surface:#ffffff;
    --border:#dde3f5;
    --border-strong:#c7d0ee;
    --text:#161a35;
    --text-secondary:#454b74;
    --text-muted:#767ea3;
    --accent:#0e7490;
    --accent-dark:#0b5b70;
    --accent-soft:#e0f5f8;
    --accent-soft-strong:#c3ecf2;
    --accent-glow:#22d3ee;
    --accent2:#e0a100;
    --danger:#b91c1c;
    --danger-bg:#fdf0f0;
    --danger-border:#f3c9c9;
    --shadow: 0 1px 2px rgba(20,25,60,.05), 0 4px 18px rgba(20,30,80,.08);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    position:relative;
  }
  /* faint heroic backdrop: starfield + spotlight, CSS only, no assets */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    background-image:
      radial-gradient(1px 1px at 12% 18%, var(--text-muted) 0, transparent 60%),
      radial-gradient(1px 1px at 82% 8%, var(--text-muted) 0, transparent 60%),
      radial-gradient(1.5px 1.5px at 32% 62%, var(--text-muted) 0, transparent 60%),
      radial-gradient(1px 1px at 68% 78%, var(--text-muted) 0, transparent 60%),
      radial-gradient(1px 1px at 91% 42%, var(--text-muted) 0, transparent 60%),
      radial-gradient(1.5px 1.5px at 6% 88%, var(--text-muted) 0, transparent 60%),
      radial-gradient(1px 1px at 45% 30%, var(--text-muted) 0, transparent 60%);
    opacity:.16;
  }
  body::after{
    content:"";
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    background:radial-gradient(60% 50% at 50% 8%, color-mix(in srgb, var(--accent-glow) 16%, transparent), transparent 70%);
  }
  #loginView, #chatView{position:relative;z-index:1}
  button{font-family:inherit}

  *:focus-visible{
    outline:2px solid var(--accent-glow);
    outline-offset:2px;
    border-radius:4px;
  }

  /* ---------- Emblem (shared logo mark) ---------- */
  .emblem{
    display:flex;align-items:center;justify-content:center;
    filter:drop-shadow(0 2px 10px color-mix(in srgb, var(--accent-glow) 45%, transparent));
    animation:emblem-glow 3.2s ease-in-out infinite;
  }
  .emblem svg{width:100%;height:100%;color:var(--accent)}
  .emblem-bar{fill:var(--surface)}
  .emblem-spark{fill:var(--accent2)}
  .emblem-tail{fill:currentColor;opacity:.85}
  @keyframes emblem-glow{
    0%,100%{filter:drop-shadow(0 2px 10px color-mix(in srgb, var(--accent-glow) 40%, transparent))}
    50%{filter:drop-shadow(0 2px 16px color-mix(in srgb, var(--accent-glow) 65%, transparent))}
  }
  @media (prefers-reduced-motion: reduce){
    .emblem{animation:none}
  }

  /* ---------- Login view ---------- */
  #loginView{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .login-card{
    width:100%;
    max-width:360px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:32px 28px;
    text-align:center;
  }
  .login-logo{
    width:56px;height:56px;
    margin:0 auto 16px;
  }
  .login-card h1{font-size:20px;font-weight:700;margin:0 0 4px;letter-spacing:-.01em}
  .login-card p.tagline{font-size:13px;font-weight:650;color:var(--accent);margin:0 0 10px;letter-spacing:.01em}
  .login-card p.sub{font-size:13px;color:var(--text-muted);margin:0 0 22px}
  .login-card input[type=password]{
    width:100%;
    padding:11px 13px;
    border-radius:var(--radius-sm);
    border:1px solid var(--border-strong);
    background:var(--bg);
    color:var(--text);
    font-size:14px;
    outline:none;
    margin-bottom:12px;
  }
  .login-card input[type=password]:focus{border-color:var(--accent)}
  .login-card button{
    width:100%;
    padding:11px 13px;
    border-radius:var(--radius-sm);
    border:none;
    background:var(--accent);
    color:#fff;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:background .15s ease;
  }
  .login-card button:hover{background:var(--accent-dark)}
  .login-card button:disabled{opacity:.6;cursor:default}
  .login-error{
    color:var(--danger);
    font-size:12.5px;
    margin-top:10px;
    min-height:16px;
  }
  @keyframes shake{
    10%,90%{transform:translateX(-1px)}
    20%,80%{transform:translateX(2px)}
    30%,50%,70%{transform:translateX(-4px)}
    40%,60%{transform:translateX(4px)}
  }
  .shake{animation:shake .4s cubic-bezier(.36,.07,.19,.97) both}
  @media (prefers-reduced-motion: reduce){
    .shake{animation:none}
  }

  /* ---------- Chat view ---------- */
  #chatView{
    flex:1;
    display:none;
    flex-direction:column;
    min-height:0;
    height:100%;
  }
  #chatView.active{display:flex}
  #loginView.hidden{display:none}

  .hdr{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:12px 20px;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .hdr-brand{display:flex;align-items:center;gap:10px}
  .hdr-logo{
    width:30px;height:30px;flex-shrink:0;
  }
  .hdr-title{font-size:15px;font-weight:700;letter-spacing:-.01em;color:var(--text)}
  #newChatBtn{
    display:flex;align-items:center;gap:6px;
    padding:7px 13px;
    border-radius:8px;
    border:1px solid var(--border-strong);
    background:var(--surface);
    color:var(--text-secondary);
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    transition:all .15s ease;
  }
  #newChatBtn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

  #messages{
    flex:1;
    overflow-y:auto;
    padding:20px 16px 12px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .msg-row{display:flex;width:100%}
  .msg-row.user{justify-content:flex-end}
  .msg-row.assistant{justify-content:flex-start}
  .bubble{
    max-width:min(720px, 88%);
    padding:11px 15px;
    border-radius:14px;
    font-size:14.5px;
    line-height:1.5;
    word-wrap:break-word;
    box-shadow:var(--shadow);
  }
  .msg-row.user .bubble{
    background:var(--accent);
    color:#fff;
    border-bottom-right-radius:4px;
  }
  .msg-row.assistant .bubble{
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text);
    border-bottom-left-radius:4px;
  }
  .msg-row.system .bubble{
    background:var(--danger-bg);
    border:1px solid var(--danger-border);
    color:var(--danger);
    max-width:min(720px,88%);
  }
  .bubble p{margin:0 0 8px}
  .bubble p:last-child{margin-bottom:0}
  .bubble h2{font-size:15.5px;margin:10px 0 6px;font-weight:650}
  .bubble h2:first-child{margin-top:0}
  .bubble ul{margin:0 0 8px;padding-left:20px}
  .bubble li{margin:2px 0}
  .bubble code{
    background:var(--accent-soft);
    color:var(--accent-dark);
    padding:1px 5px;
    border-radius:4px;
    font-size:.9em;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  .msg-row.user .bubble code{background:rgba(255,255,255,.22);color:#fff}
  .bubble pre{
    background:var(--accent-soft);
    border:1px solid var(--accent-soft-strong);
    border-radius:8px;
    padding:10px 12px;
    overflow-x:auto;
    margin:0 0 8px;
  }
  .bubble pre code{background:none;padding:0;color:inherit;font-size:12.5px}
  .bubble table{border-collapse:collapse;margin:0 0 8px;font-size:13px;width:100%}
  .bubble table th,.bubble table td{border:1px solid var(--border-strong);padding:5px 9px;text-align:left}
  .bubble table th{background:var(--accent-soft);font-weight:650}
  .bubble strong{font-weight:650}

  .typing{display:inline-flex;align-items:center;gap:4px;padding:4px 2px}
  .typing span{
    width:6px;height:6px;border-radius:50%;
    background:var(--text-muted);
    animation:bounce 1.1s infinite ease-in-out;
  }
  .typing span:nth-child(2){animation-delay:.15s}
  .typing span:nth-child(3){animation-delay:.3s}
  @keyframes bounce{
    0%,60%,100%{transform:translateY(0);opacity:.5}
    30%{transform:translateY(-4px);opacity:1}
  }
  @media (prefers-reduced-motion: reduce){
    .typing span{animation:none;opacity:.8}
  }

  /* table result card */
  .table-card{
    margin-top:6px;
    max-width:min(720px,96%);
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    box-shadow:var(--shadow);
    padding:12px;
    align-self:flex-start;
  }
  .table-card-hdr{
    display:flex;align-items:center;justify-content:space-between;
    gap:8px;margin-bottom:8px;flex-wrap:wrap;
  }
  .table-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .badge{
    font-size:11px;font-weight:650;
    padding:3px 8px;border-radius:100px;
    background:var(--accent-soft);color:var(--accent-dark);
  }
  .badge.truncated{background:#fef3c7;color:#92400e}
  @media (prefers-color-scheme: dark){
    .badge.truncated{background:#3a2e0f;color:#fbbf24}
  }
  :root[data-theme="dark"] .badge.truncated{background:#3a2e0f;color:#fbbf24}
  .dl-btn{
    display:flex;align-items:center;gap:5px;
    padding:6px 11px;
    border-radius:7px;
    border:1px solid var(--border-strong);
    background:var(--surface);
    color:var(--accent-dark);
    font-size:12px;font-weight:650;
    cursor:pointer;
  }
  .dl-btn:hover{border-color:var(--accent);background:var(--accent-soft)}
  .table-scroll{overflow-x:auto;max-height:340px;overflow-y:auto;border:1px solid var(--border);border-radius:8px}
  .table-scroll table{border-collapse:collapse;width:100%;font-size:12.5px;white-space:nowrap}
  .table-scroll th,.table-scroll td{padding:6px 10px;border-bottom:1px solid var(--border);text-align:left}
  .table-scroll thead th{
    position:sticky;top:0;
    background:var(--accent-soft);
    color:var(--accent-dark);
    font-weight:650;
    z-index:1;
  }
  .table-scroll tbody tr:hover{background:var(--accent-soft)}
  .row-note{font-size:11.5px;color:var(--text-muted);margin-top:6px}
  details.sql-disclosure{margin-top:8px;font-size:12px}
  details.sql-disclosure summary{
    cursor:pointer;color:var(--text-muted);font-weight:600;
    list-style:none;
  }
  details.sql-disclosure summary::-webkit-details-marker{display:none}
  details.sql-disclosure summary::before{content:"▸ ";}
  details.sql-disclosure[open] summary::before{content:"▾ ";}
  details.sql-disclosure pre{
    margin-top:6px;background:var(--bg);border:1px solid var(--border);
    border-radius:7px;padding:9px 11px;overflow-x:auto;font-size:12px;
    color:var(--text-secondary);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }

  /* empty state */
  #emptyState{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
    gap:16px;
  }
  #emptyState .empty-icon{
    width:60px;height:60px;
  }
  #emptyState h2{font-size:17px;font-weight:700;margin:0;color:var(--text);max-width:380px}
  #emptyState p{font-size:13px;color:var(--text-muted);margin:0;max-width:360px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:560px}
  .chip{
    padding:8px 14px;
    border-radius:100px;
    border:1px solid var(--border-strong);
    background:var(--surface);
    color:var(--text-secondary);
    font-size:12.5px;
    cursor:pointer;
    transition:all .15s ease;
    box-shadow:var(--shadow);
  }
  .chip:hover{border-color:var(--accent);color:var(--accent-dark);background:var(--accent-soft)}

  /* composer */
  #composerWrap{
    flex-shrink:0;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:var(--bg);
    border-top:1px solid var(--border);
  }
  #composer{
    display:flex;
    align-items:flex-end;
    gap:8px;
    background:var(--surface);
    border:1px solid var(--border-strong);
    border-radius:16px;
    padding:8px 8px 8px 14px;
    box-shadow:var(--shadow);
    max-width:820px;
    margin:0 auto;
  }
  #composer:focus-within{border-color:var(--accent)}
  #msgInput{
    flex:1;
    border:none;
    outline:none;
    background:transparent;
    resize:none;
    font-family:inherit;
    font-size:14.5px;
    line-height:1.4;
    color:var(--text);
    max-height:160px;
    padding:7px 0;
  }
  #msgInput::placeholder{color:var(--text-muted)}
  #sendBtn{
    flex-shrink:0;
    width:36px;height:36px;
    border-radius:11px;
    border:none;
    background:var(--accent);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:background .15s ease, opacity .15s ease;
  }
  #sendBtn:hover:not(:disabled){background:var(--accent-dark)}
  #sendBtn:disabled{opacity:.45;cursor:default}
  #sendBtn svg{width:17px;height:17px}

  .app-footer{
    text-align:center;
    font-size:11px;
    color:var(--text-muted);
    padding:6px 0 2px;
  }

  @media (max-width: 640px){
    .hdr{padding:10px 14px}
    .hdr-title{font-size:14px}
    #messages{padding:14px 10px 8px}
    .bubble{max-width:92%}
    .table-card{max-width:100%}
    #composerWrap{padding:10px 10px calc(10px + env(safe-area-inset-bottom))}
  }
</style>
</head>
<body>

<!-- ================= LOGIN VIEW ================= -->
<div id="loginView">
  <div class="login-card">
    <div class="login-logo emblem">
      <svg viewBox="0 0 48 48" fill="none" role="img" aria-label="Analyst emblem: a hero shield holding a rising bar chart with a lightning spark">
        <defs>
          <linearGradient id="analystGradLogin" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="currentColor" stop-opacity="0.95"/>
            <stop offset="100%" stop-color="currentColor" stop-opacity="0.72"/>
          </linearGradient>
        </defs>
        <path d="M24 2.5 L41 8.5 V21 C41 33 33.5 42 24 45.5 C14.5 42 7 33 7 21 V8.5 Z" fill="url(#analystGradLogin)"/>
        <path d="M24 45.5 C20.2 44.1 16.8 42 14.2 39.2 C16.6 39.9 19.1 39.2 20.4 37.1 L24 40.6 Z" class="emblem-tail"/>
        <rect x="15" y="26" width="4.4" height="10" rx="1.3" class="emblem-bar"/>
        <rect x="21.6" y="20" width="4.4" height="16" rx="1.3" class="emblem-bar"/>
        <rect x="28.2" y="15" width="4.4" height="21" rx="1.3" class="emblem-bar"/>
        <path d="M32.5 5.5 L27.6 15.5 L31.7 15.5 L28.4 23.3 L36.4 12 L31.6 12 Z" class="emblem-spark"/>
      </svg>
    </div>
    <h1>Analyst</h1>
    <p class="tagline">Ask. Analyze. Answer.</p>
    <p class="sub">Enter the shared password to continue</p>
    <form id="loginForm" autocomplete="off">
      <input type="password" id="passwordInput" placeholder="Password" autocomplete="current-password" required>
      <button type="submit" id="loginBtn">Sign in</button>
      <div class="login-error" id="loginError"></div>
    </form>
  </div>
</div>

<!-- ================= CHAT VIEW ================= -->
<div id="chatView">
  <div class="hdr">
    <div class="hdr-brand">
      <div class="hdr-logo emblem">
        <svg viewBox="0 0 48 48" fill="none" role="img" aria-label="Analyst emblem: a hero shield holding a rising bar chart with a lightning spark">
          <defs>
            <linearGradient id="analystGradHdr" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="currentColor" stop-opacity="0.95"/>
              <stop offset="100%" stop-color="currentColor" stop-opacity="0.72"/>
            </linearGradient>
          </defs>
          <path d="M24 2.5 L41 8.5 V21 C41 33 33.5 42 24 45.5 C14.5 42 7 33 7 21 V8.5 Z" fill="url(#analystGradHdr)"/>
          <path d="M24 45.5 C20.2 44.1 16.8 42 14.2 39.2 C16.6 39.9 19.1 39.2 20.4 37.1 L24 40.6 Z" class="emblem-tail"/>
          <rect x="15" y="26" width="4.4" height="10" rx="1.3" class="emblem-bar"/>
          <rect x="21.6" y="20" width="4.4" height="16" rx="1.3" class="emblem-bar"/>
          <rect x="28.2" y="15" width="4.4" height="21" rx="1.3" class="emblem-bar"/>
          <path d="M32.5 5.5 L27.6 15.5 L31.7 15.5 L28.4 23.3 L36.4 12 L31.6 12 Z" class="emblem-spark"/>
        </svg>
      </div>
      <div class="hdr-title">Analyst</div>
    </div>
    <button id="newChatBtn" type="button">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      New chat
    </button>
  </div>

  <div id="messages"></div>

  <div id="emptyState">
    <div class="empty-icon emblem">
      <svg viewBox="0 0 48 48" fill="none" role="img" aria-label="Analyst emblem: a hero shield holding a rising bar chart with a lightning spark">
        <defs>
          <linearGradient id="analystGradEmpty" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="currentColor" stop-opacity="0.95"/>
            <stop offset="100%" stop-color="currentColor" stop-opacity="0.72"/>
          </linearGradient>
        </defs>
        <path d="M24 2.5 L41 8.5 V21 C41 33 33.5 42 24 45.5 C14.5 42 7 33 7 21 V8.5 Z" fill="url(#analystGradEmpty)"/>
        <path d="M24 45.5 C20.2 44.1 16.8 42 14.2 39.2 C16.6 39.9 19.1 39.2 20.4 37.1 L24 40.6 Z" class="emblem-tail"/>
        <rect x="15" y="26" width="4.4" height="10" rx="1.3" class="emblem-bar"/>
        <rect x="21.6" y="20" width="4.4" height="16" rx="1.3" class="emblem-bar"/>
        <rect x="28.2" y="15" width="4.4" height="21" rx="1.3" class="emblem-bar"/>
        <path d="M32.5 5.5 L27.6 15.5 L31.7 15.5 L28.4 23.3 L36.4 12 L31.6 12 Z" class="emblem-spark"/>
      </svg>
    </div>
    <h2>Analyst at your service — what data can I dig up?</h2>
    <p>Try one of these, or type your own question below.</p>
    <div class="chips" id="chipRow">
      <button class="chip" type="button" data-q="How many leads signed up last week?">How many leads signed up last week?</button>
      <button class="chip" type="button" data-q="Settlement amount collected this month">Settlement amount collected this month</button>
      <button class="chip" type="button" data-q="Lead funnel by source for July">Lead funnel by source for July</button>
    </div>
  </div>

  <div id="composerWrap">
    <div id="composer">
      <textarea id="msgInput" rows="1" placeholder="Ask about leads, settlements, funnels..."></textarea>
      <button id="sendBtn" type="button" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 12l16-7-6 7 6 7-16-7Z" fill="#fff"/></svg>
      </button>
    </div>
    <div class="app-footer">Analyst — your data superhero</div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var messagesEl = document.getElementById('messages');
  var emptyStateEl = document.getElementById('emptyState');
  var loginView = document.getElementById('loginView');
  var chatView = document.getElementById('chatView');
  var loginForm = document.getElementById('loginForm');
  var passwordInput = document.getElementById('passwordInput');
  var loginBtn = document.getElementById('loginBtn');
  var loginError = document.getElementById('loginError');
  var loginCard = document.querySelector('.login-card');
  var msgInput = document.getElementById('msgInput');
  var sendBtn = document.getElementById('sendBtn');
  var newChatBtn = document.getElementById('newChatBtn');
  var chipRow = document.getElementById('chipRow');

  var history = []; // {role, content}
  var pending = false;

  // ---------------- view switching ----------------
  function showChat(){
    loginView.classList.add('hidden');
    chatView.classList.add('active');
  }
  function showLogin(){
    chatView.classList.remove('active');
    loginView.classList.remove('hidden');
  }

  // Optimistically show chat on load; first 401 from /api/chat flips to login.
  showChat();
  updateEmptyState();

  // ---------------- login ----------------
  loginForm.addEventListener('submit', function(e){
    e.preventDefault();
    var pw = passwordInput.value;
    if(!pw) return;
    loginBtn.disabled = true;
    loginError.textContent = '';
    fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({password: pw})
    }).then(function(res){
      return res.json().catch(function(){ return {}; }).then(function(data){
        return {status: res.status, data: data};
      });
    }).then(function(r){
      loginBtn.disabled = false;
      if(r.status === 200 && r.data && r.data.ok){
        passwordInput.value = '';
        showChat();
      } else {
        loginFail('Incorrect password.');
      }
    }).catch(function(){
      loginBtn.disabled = false;
      loginFail('Network error. Please try again.');
    });
  });

  function loginFail(msg){
    loginError.textContent = msg;
    loginCard.classList.remove('shake');
    // force reflow to restart animation
    void loginCard.offsetWidth;
    loginCard.classList.add('shake');
  }

  // ---------------- composer ----------------
  function autoGrow(){
    msgInput.style.height = 'auto';
    msgInput.style.height = Math.min(msgInput.scrollHeight, 160) + 'px';
  }
  msgInput.addEventListener('input', autoGrow);
  msgInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      sendMessage();
    }
  });
  sendBtn.addEventListener('click', sendMessage);

  newChatBtn.addEventListener('click', function(){
    if(pending) return;
    history = [];
    messagesEl.innerHTML = '';
    updateEmptyState();
    msgInput.value = '';
    autoGrow();
  });

  chipRow.addEventListener('click', function(e){
    var btn = e.target.closest('.chip');
    if(!btn) return;
    msgInput.value = btn.getAttribute('data-q');
    autoGrow();
    msgInput.focus();
  });

  function updateEmptyState(){
    emptyStateEl.style.display = history.length === 0 ? 'flex' : 'none';
    messagesEl.style.display = history.length === 0 ? 'none' : 'flex';
  }

  // ---------------- markdown (minimal, safe) ----------------
  function escapeHtml(s){
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function renderInline(s){
    // s already escaped. Handle `code` then **bold**.
    s = s.replace(/`([^`]+)`/g, function(_, code){
      return '<code>' + code + '</code>';
    });
    s = s.replace(/\*\*([^*]+)\*\*/g, function(_, b){
      return '<strong>' + b + '</strong>';
    });
    return s;
  }

  function isTableSepLine(line){
    return /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(line);
  }

  function splitTableRow(line){
    var t = line.trim();
    if(t.startsWith('|')) t = t.slice(1);
    if(t.endsWith('|')) t = t.slice(0, -1);
    return t.split('|').map(function(c){ return c.trim(); });
  }

  function renderMarkdown(raw){
    var escaped = escapeHtml(raw == null ? '' : String(raw));
    var lines = escaped.split(/\r?\n/);
    var html = '';
    var i = 0;
    var inList = false;

    function closeList(){
      if(inList){ html += '</ul>'; inList = false; }
    }

    while(i < lines.length){
      var line = lines[i];

      // fenced code block
      var fenceMatch = line.match(/^\s*```(.*)$/);
      if(fenceMatch){
        closeList();
        var codeLines = [];
        i++;
        while(i < lines.length && !/^\s*```\s*$/.test(lines[i])){
          codeLines.push(lines[i]);
          i++;
        }
        i++; // skip closing fence
        html += '<pre><code>' + codeLines.join('\n') + '</code></pre>';
        continue;
      }

      // heading
      var headingMatch = line.match(/^\s*##\s+(.*)$/);
      if(headingMatch){
        closeList();
        html += '<h2>' + renderInline(headingMatch[1]) + '</h2>';
        i++;
        continue;
      }

      // table: header line + separator line
      if(line.indexOf('|') !== -1 && i + 1 < lines.length && isTableSepLine(lines[i+1])){
        closeList();
        var headerCells = splitTableRow(line);
        var bodyRows = [];
        i += 2;
        while(i < lines.length && lines[i].indexOf('|') !== -1 && lines[i].trim() !== ''){
          bodyRows.push(splitTableRow(lines[i]));
          i++;
        }
        html += '<table><thead><tr>' + headerCells.map(function(c){
          return '<th>' + renderInline(c) + '</th>';
        }).join('') + '</tr></thead><tbody>';
        bodyRows.forEach(function(row){
          html += '<tr>' + row.map(function(c){
            return '<td>' + renderInline(c) + '</td>';
          }).join('') + '</tr>';
        });
        html += '</tbody></table>';
        continue;
      }

      // list item
      var listMatch = line.match(/^\s*-\s+(.*)$/);
      if(listMatch){
        if(!inList){ html += '<ul>'; inList = true; }
        html += '<li>' + renderInline(listMatch[1]) + '</li>';
        i++;
        continue;
      }

      closeList();

      if(line.trim() === ''){
        i++;
        continue;
      }

      // plain paragraph line (collect consecutive non-blank, non-special lines)
      var paraLines = [line];
      i++;
      while(i < lines.length && lines[i].trim() !== '' &&
            !/^\s*```/.test(lines[i]) && !/^\s*##\s+/.test(lines[i]) &&
            !/^\s*-\s+/.test(lines[i]) &&
            !(lines[i].indexOf('|') !== -1 && i + 1 < lines.length && isTableSepLine(lines[i+1]))){
        paraLines.push(lines[i]);
        i++;
      }
      html += '<p>' + paraLines.map(renderInline).join('<br>') + '</p>';
    }
    closeList();
    return html;
  }

  // ---------------- CSV export ----------------
  function csvQuote(v){
    var s = (v === null || v === undefined) ? '' : String(v);
    // Neutralize spreadsheet formula injection (OWASP CSV injection guard):
    // if the cell starts with a char Excel/Sheets treats as a formula/command
    // trigger, prefix with an apostrophe so it round-trips as inert text.
    if(/^[=+\-@\t\r]/.test(s)){
      s = "'" + s;
    }
    if(/[",\n\r]/.test(s)){
      s = '"' + s.replace(/"/g, '""') + '"';
    }
    return s;
  }

  function downloadCsv(columns, rows){
    var lines = [];
    lines.push(columns.map(csvQuote).join(','));
    rows.forEach(function(row){
      lines.push(row.map(csvQuote).join(','));
    });
    var csv = lines.join('\r\n');
    var blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var ts = new Date().toISOString().replace(/[:.]/g, '-');
    a.href = url;
    a.download = 'analyst-' + ts + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  // ---------------- rendering messages ----------------
  function scrollToBottom(){
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addUserMessage(text){
    var row = document.createElement('div');
    row.className = 'msg-row user';
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text; // plain text, no markdown for user input
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    scrollToBottom();
  }

  function addSystemError(text){
    var row = document.createElement('div');
    row.className = 'msg-row system';
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    scrollToBottom();
  }

  function addTypingIndicator(){
    var row = document.createElement('div');
    row.className = 'msg-row assistant';
    row.id = 'typingRow';
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    scrollToBottom();
  }

  function removeTypingIndicator(){
    var row = document.getElementById('typingRow');
    if(row) row.remove();
  }

  function buildTableCard(tbl){
    var card = document.createElement('div');
    card.className = 'table-card';

    var columns = tbl.columns || [];
    var rows = tbl.rows || [];
    var rowCount = (typeof tbl.row_count === 'number') ? tbl.row_count : rows.length;
    var truncated = !!tbl.truncated;
    var displayRows = rows.slice(0, 200);

    var hdr = document.createElement('div');
    hdr.className = 'table-card-hdr';

    var meta = document.createElement('div');
    meta.className = 'table-meta';
    var countBadge = document.createElement('span');
    countBadge.className = 'badge';
    countBadge.textContent = rowCount + ' row' + (rowCount === 1 ? '' : 's');
    meta.appendChild(countBadge);
    if(truncated){
      var truncBadge = document.createElement('span');
      truncBadge.className = 'badge truncated';
      truncBadge.textContent = 'truncated';
      meta.appendChild(truncBadge);
    }
    hdr.appendChild(meta);

    var dlBtn = document.createElement('button');
    dlBtn.type = 'button';
    dlBtn.className = 'dl-btn';
    dlBtn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> Download CSV';
    dlBtn.addEventListener('click', function(){
      downloadCsv(columns, rows);
    });
    hdr.appendChild(dlBtn);

    card.appendChild(hdr);

    var scrollWrap = document.createElement('div');
    scrollWrap.className = 'table-scroll';
    var table = document.createElement('table');
    var thead = document.createElement('thead');
    var headRow = document.createElement('tr');
    columns.forEach(function(c){
      var th = document.createElement('th');
      th.textContent = c;
      headRow.appendChild(th);
    });
    thead.appendChild(headRow);
    table.appendChild(thead);

    var tbody = document.createElement('tbody');
    displayRows.forEach(function(row){
      var tr = document.createElement('tr');
      row.forEach(function(cell){
        var td = document.createElement('td');
        td.textContent = (cell === null || cell === undefined) ? '' : String(cell);
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    scrollWrap.appendChild(table);
    card.appendChild(scrollWrap);

    if(rows.length > 200 || rowCount > displayRows.length){
      var note = document.createElement('div');
      note.className = 'row-note';
      note.textContent = 'showing ' + displayRows.length + ' of ' + rowCount;
      card.appendChild(note);
    }

    if(tbl.sql){
      var details = document.createElement('details');
      details.className = 'sql-disclosure';
      var summary = document.createElement('summary');
      summary.textContent = 'SQL';
      details.appendChild(summary);
      var pre = document.createElement('pre');
      pre.textContent = tbl.sql;
      details.appendChild(pre);
      card.appendChild(details);
    }

    return card;
  }

  function addAssistantMessage(reply, tables){
    var row = document.createElement('div');
    row.className = 'msg-row assistant';
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = renderMarkdown(reply);
    row.appendChild(bubble);
    messagesEl.appendChild(row);

    if(tables && tables.length){
      tables.forEach(function(tbl){
        var tableRow = document.createElement('div');
        tableRow.className = 'msg-row assistant';
        tableRow.appendChild(buildTableCard(tbl));
        messagesEl.appendChild(tableRow);
      });
    }
    scrollToBottom();
  }

  // ---------------- send flow ----------------
  function setPending(state){
    pending = state;
    sendBtn.disabled = state;
    msgInput.disabled = state;
  }

  function sendMessage(){
    if(pending) return;
    var text = msgInput.value.trim();
    if(!text) return;

    history.push({role: 'user', content: text});
    updateEmptyState();
    addUserMessage(text);
    msgInput.value = '';
    autoGrow();
    setPending(true);
    addTypingIndicator();

    var payloadMessages = history.slice(-12);

    fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({messages: payloadMessages})
    }).then(function(res){
      if(res.status === 401){
        removeTypingIndicator();
        setPending(false);
        showLogin();
        return null;
      }
      return res.json().catch(function(){ return null; }).then(function(data){
        return {status: res.status, data: data};
      });
    }).then(function(r){
      if(r === null) return; // handled 401 above
      removeTypingIndicator();
      setPending(false);
      if(r.status === 200 && r.data && typeof r.data.reply === 'string'){
        history.push({role: 'assistant', content: r.data.reply});
        addAssistantMessage(r.data.reply, r.data.tables);
      } else {
        var errMsg = (r.data && r.data.error) ? r.data.error : ('Request failed (status ' + r.status + ').');
        addSystemError('Something went wrong: ' + errMsg + ' Please try again.');
      }
    }).catch(function(){
      removeTypingIndicator();
      setPending(false);
      addSystemError('Network error — could not reach the server. Please check your connection and try again.');
    });
  }

})();
</script>
</body>
</html>
